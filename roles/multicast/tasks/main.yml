---
- name: Install software for multicast routing
  ansible.builtin.apt:
    name: "{{ multicast_pimd_pkg_list }}"
    state: present

- name: Fix configuration for multicast
  ansible.builtin.template:
    src: pimd.conf
    dest: /etc/pimd.conf
    mode: "0644"
    owner: root
  notify:
    - Restart pimd

- name: Turn on services
  ansible.builtin.systemd:
    enabled: true
    name: pimd.service
