---
- name: Initialize etckeeper
  ansible.builtin.command:
    cmd: "sh -c 'etckeeper init && /etc/etckeeper/daily'"
    chdir: /etc
    creates: /etc/.git
  changed_when: false

- name: Start snaps
  ansible.builtin.command:
    cmd: "snap start {{ item }}"
  loop: "{{ snap_pkg_list }}"
  failed_when: false
  changed_when: true
