---
- name: Uninstall unwanted software (apt)
  ansible.builtin.apt:
    name: "{{ tools_apt_not_installed_list }}"
    state: absent

- name: Install software (apt)
  ansible.builtin.apt:
    name: "{{ tools_apt_pkg_list }}"
    state: present
    update_cache: true
  notify:
    - Initialize etckeeper

- name: Install software (snap)
  community.general.snap:
    name: "{{ tools_snap_pkg_list }}"
    state: present
  notify:
    - Start snaps
