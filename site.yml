---
- name: Common for all
  hosts: all
  roles:
    - { role: tools, become: true, tags: tools }
    - { role: disabled_services, become: true, tags: disabled_services }
    - { role: sshd_configuration, become: true, tags: sshd_configuration }

- name: Configure external point
  hosts: utsida
  roles:
    - { role: multicast, become: true, tags: multicast }
    - { role: bridge, become: true, tags: bridge }
    - { role: filters, become: true, tags: filters }
    - { role: tunnels, become: true, tags: tunnels }
    - { role: sysctl, become: true, tags: sysctl }
    - { role: dhcp, become: true, tags: dhcp }
    - { role: mqtt, become: true, tags: mqtt }
    - { role: haproxy, become: true, tags: haproxy }
